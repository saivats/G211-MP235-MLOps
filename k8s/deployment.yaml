apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp235-api
  labels:
    app: mp235-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp235-api
  template:
    metadata:
      labels:
        app: mp235-api
    spec:
      containers:
        - name: mp235-api
          image: mp235-api:1.0
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
