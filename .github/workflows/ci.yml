on:
  push:

name: CI

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Verify the packaged champion over HTTP
        run: |
          set -euo pipefail
          docker build -t mp235-api:1.0 .
          docker run -d --name mp235-smoke -p 127.0.0.1:18000:8000 mp235-api:1.0
          trap 'docker logs mp235-smoke; docker rm -f mp235-smoke' EXIT
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:18000/health | jq -e '.status == "ok"'
          python - <<'PY'
          import json
          import urllib.request

          import joblib
          import pandas as pd

          row = dict(storage_days=100, temp_set_c=4.0, humidity_pct=80.0,
                     power_cuts_hours=2.0, bag_weight_kg=25.0,
                     door_openings_per_day=5, crop="potato", chamber="Chamber 1")
          expected = joblib.load("models/model.joblib").predict(pd.DataFrame([row]))[0]
          request = urllib.request.Request("http://127.0.0.1:18000/predict",
                                           data=json.dumps(row).encode(),
                                           headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              assert json.load(response)["spoilage_pct"] == expected
          PY
